<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asistente Biblioteca Virtual</title>
<style>
    :root {
        --primary: #0097B1;
        --primary-dark: #007285;
        --accent: #239089;
        --bg: #eef2f7;
        --bot-bg: #eef0f2;
        --user-bg: #d1e7dd;
        --text: #22303f;
        --radius: 16px;
    }

    * { box-sizing: border-box; }

    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: linear-gradient(135deg, var(--bg), #dfe9f3);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 16px;
    }

    .chat-container {
        width: 100%;
        max-width: 420px;
        height: min(680px, 90vh);
        background: white;
        border-radius: var(--radius);
        box-shadow: 0 10px 30px rgba(0,0,0,0.18);
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    .chat-header {
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: white;
        padding: 16px;
        text-align: center;
        font-weight: 600;
        font-size: 15px;
        display: flex;
        flex-direction: column;
        gap: 2px;
    }

    .chat-header small {
        font-weight: 400;
        font-size: 11px;
        opacity: 0.9;
    }

    .chat-messages {
        flex: 1;
        padding: 14px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 4px;
        background: #fbfcfe;
    }

    .message {
        padding: 10px 14px;
        border-radius: 14px;
        max-width: 80%;
        word-wrap: break-word;
        line-height: 1.4;
        font-size: 14px;
        animation: fadeIn 0.15s ease-in;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .user {
        background: var(--user-bg);
        align-self: flex-end;
        border-bottom-right-radius: 4px;
    }

    .bot {
        background: var(--bot-bg);
        align-self: flex-start;
        border-bottom-left-radius: 4px;
    }

    .feedback-row {
        display: flex;
        gap: 6px;
        margin-top: 4px;
        align-self: flex-start;
    }

    .feedback-row button {
        background: none;
        border: 1px solid #d5dbe2;
        border-radius: 10px;
        padding: 2px 8px;
        cursor: pointer;
        font-size: 12px;
        color: #556;
        transition: background 0.15s;
    }

    .feedback-row button:hover { background: #eef2f7; }
    .feedback-row button.selected { background: var(--primary); color: white; border-color: var(--primary); }

    .typing {
        display: flex;
        gap: 4px;
        align-self: flex-start;
        padding: 10px 14px;
        background: var(--bot-bg);
        border-radius: 14px;
        border-bottom-left-radius: 4px;
    }

    .typing span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #9aa5b1;
        animation: blink 1.2s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
        0%, 80%, 100% { opacity: 0.2; }
        40% { opacity: 1; }
    }

    .suggestions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
        align-self: flex-start;
    }

    .suggestions button {
        background: white;
        color: var(--primary-dark);
        border: 1px solid var(--primary);
        border-radius: 15px;
        padding: 6px 12px;
        cursor: pointer;
        font-size: 12px;
        transition: background 0.15s, color 0.15s;
    }

    .suggestions button:hover {
        background: var(--primary);
        color: white;
    }

    .chat-input {
        display: flex;
        border-top: 1px solid #e2e6ea;
        padding: 8px;
        gap: 8px;
        background: white;
    }

    .chat-input input {
        flex: 1;
        padding: 10px 12px;
        border: 1px solid #dfe3e8;
        border-radius: 20px;
        outline: none;
        font-size: 14px;
    }

    .chat-input input:focus {
        border-color: var(--primary);
    }

    .chat-input button {
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 20px;
        padding: 10px 18px;
        cursor: pointer;
        font-size: 14px;
    }

    .chat-input button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }
</style>
</head>
<body>

<div class="chat-container" role="region" aria-label="Asistente virtual de la biblioteca">
    <div class="chat-header">
        📚 Asistente Biblioteca Virtual
        <small>Universidad Castro Carazo</small>
    </div>

    <div class="chat-messages" id="chatMessages" aria-live="polite">

        <div class="message bot">
            Hola 👋 Soy el Asistente Oficial de la Biblioteca Virtual.
            Puedes seleccionar una opción o escribir tu consulta.
        </div>

        <div class="suggestions" id="initialSuggestions">
            {% for suggestion in suggestions %}
                <button type="button" onclick="sendSuggestion('{{ suggestion.text|e }}')">
                    {{ suggestion.label }}
                </button>
            {% endfor %}
        </div>

    </div>

    <div class="chat-input">
        <input type="text" id="userInput" placeholder="Escribe tu pregunta..."
               aria-label="Escribe tu pregunta"
               onkeypress="if(event.key==='Enter') sendMessage()">
        <button type="button" id="sendBtn" onclick="sendMessage()">Enviar</button>
    </div>
</div>

<script>
const chatMessages = document.getElementById("chatMessages");
const input = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");

function sendSuggestion(text) {
    input.value = text;
    sendMessage();
}

function addUserMessage(text) {
    const div = document.createElement("div");
    div.className = "message user";
    div.innerText = text;
    chatMessages.appendChild(div);
    scrollToBottom();
}

function addTypingIndicator() {
    const div = document.createElement("div");
    div.className = "typing";
    div.id = "typingIndicator";
    div.innerHTML = "<span></span><span></span><span></span>";
    chatMessages.appendChild(div);
    scrollToBottom();
    return div;
}

function addBotMessage(text, originalMessage) {
    const wrapper = document.createElement("div");

    const div = document.createElement("div");
    div.className = "message bot";
    div.innerText = text;
    wrapper.appendChild(div);

    const feedback = document.createElement("div");
    feedback.className = "feedback-row";

    const up = document.createElement("button");
    up.type = "button";
    up.innerText = "👍";
    up.setAttribute("aria-label", "Respuesta útil");

    const down = document.createElement("button");
    down.type = "button";
    down.innerText = "👎";
    down.setAttribute("aria-label", "Respuesta no útil");

    function sendFeedback(useful, btnSelected, btnOther) {
        btnSelected.classList.add("selected");
        btnOther.disabled = true;
        btnSelected.disabled = true;
        fetch("/feedback", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: originalMessage, response: text, useful: useful })
        }).catch(() => {});
    }

    up.onclick = () => sendFeedback(true, up, down);
    down.onclick = () => sendFeedback(false, down, up);

    feedback.appendChild(up);
    feedback.appendChild(down);
    wrapper.appendChild(feedback);

    chatMessages.appendChild(wrapper);
    scrollToBottom();
}

function scrollToBottom() {
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

function sendMessage() {
    const message = input.value.trim();
    if (message === "") return;

    addUserMessage(message);
    input.value = "";
    sendBtn.disabled = true;

    const typingEl = addTypingIndicator();

    fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: message })
    })
    .then(response => response.json())
    .then(data => {
        typingEl.remove();
        addBotMessage(data.response, message);
    })
    .catch(() => {
        typingEl.remove();
        addBotMessage("Ocurrió un error. Intenta nuevamente.", message);
    })
    .finally(() => {
        sendBtn.disabled = false;
        input.focus();
    });
}
</script>

</body>
</html>
